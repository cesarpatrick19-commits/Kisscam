<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiss Cam Boda</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Video de fondo */
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Capa del Marco / Overlay */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* Deja pasar los clics al video/pantalla */
      border: 15px solid rgba(255, 255, 255, 0.8);
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 20px;
    }
    /* Header del Marco */
    .header {
      background: rgba(255, 255, 255, 0.9);
      padding: 12px 35px;
      border-radius: 50px;
      border: 3px solid #ff4d6d;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    .header h1 {
      color: #c9184a;
      font-size: 2.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 800;
    }
    /* Corazón animado en el pie */
    .footer {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 10px 25px;
      border-radius: 30px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(5px);
    }
    .heart {
      color: #ff4d6d;
      font-size: 1.8rem;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.3); }
    }
    /* Botones Flotantes de Control */
    .controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }
    .btn {
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      backdrop-filter: blur(4px);
      transition: background 0.3s;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="container" id="app">
    <!-- Video de la cámara -->
    <video id="camera" autoplay playsinline muted></video>

    <!-- Superposición del Marco Kiss Cam -->
    <div class="overlay">
      <div class="header">
        <h1>💋 KISS CAM 💋</h1>
      </div>
      <div class="footer">
        <span>¡Beso, beso, beso!</span>
        <span class="heart">❤️</span>
      </div>
    </div>

    <!-- Botones de Control -->
    <div class="controls">
      <button class="btn" id="switch-cam">🔄 Cambiar Cámara</button>
      <button class="btn" id="fullscreen">⛶ Pantalla Completa</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('camera');
    const switchBtn = document.getElementById('switch-cam');
    const fullscreenBtn = document.getElementById('fullscreen');
    let currentStream = null;
    let facingMode = "environment"; // Inicia con cámara trasera

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode },
          audio: false
        });
        currentStream = stream;
        video.srcObject = stream;
      } catch (err) {
        alert("Error al acceder a la cámara: " + err.message);
      }
    }

    // Cambiar entre cámara frontal y trasera
    switchBtn.addEventListener('click', () => {
      facingMode = facingMode === "user" ? "environment" : "user";
      startCamera();
    });

    // Modo Pantalla Completa
    fullscreenBtn.addEventListener('click', () => {
      const app = document.getElementById('app');
      if (!document.fullscreenElement) {
        app.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });

    // Iniciar cámara al cargar
    startCamera();
  </script>
</body>
</html>
