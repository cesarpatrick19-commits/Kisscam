<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Boda</title>
  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: sans-serif; background: #000; }
    
    .swiper { width: 100%; height: 100vh; max-width: 480px; margin: 0 auto; }
    .swiper-slide {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .swiper-slide img.bg-img {
      width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; z-index: 1;
    }
    
    /* Capa de botones interactivos */
    .content-overlay {
      position: relative; z-index: 2; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: flex-end;
      align-items: center; padding-bottom: 70px;
    }
    .btn-action {
      background-color: #8b263e; color: #ffffff; text-decoration: none;
      padding: 14px 28px; border-radius: 30px; font-weight: bold;
      font-size: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      display: inline-block; transition: transform 0.2s;
    }
    .btn-action:active { transform: scale(0.95); }
    .swipe-hint {
      position: absolute; bottom: 15px; width: 100%; text-align: center;
      color: rgba(255,255,255,0.7); font-size: 12px; z-index: 2;
    }
  </style>
</head>
<body>

  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      
      <!-- Pantalla 1: Portada -->
      <div class="swiper-slide">
        <img src="img/pantalla1.png" class="bg-img" alt="Portada">
      </div>

      <!-- Pantalla 2: Ubicación con Botón Dinámico -->
      <div class="swiper-slide">
        <img src="img/pantalla2.png" class="bg-img" alt="Ubicación">
        <div class="content-overlay">
          <a href="https://maps.google.com" target="_blank" class="btn-action">📍 Abrir Google Maps</a>
        </div>
      </div>

      <!-- Pantalla 3: Confirmación RSVP -->
      <div class="swiper-slide">
        <img src="img/pantalla3.png" class="bg-img" alt="RSVP">
        <div class="content-overlay">
          <a href="https://wa.me/569XXXXXXXX?text=¡Hola!%20Confirmo%20mi%20asistencia" target="_blank" class="btn-action">✍️ Confirmar por WhatsApp</a>
        </div>
      </div>

    </div>
    <div class="swipe-hint">▲ Desliza hacia arriba ▲</div>
  </div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    var swiper = new Swiper(".mySwiper", {
      direction: "vertical",
      mousewheel: true,
    });
  </script>
</body>
</html>
