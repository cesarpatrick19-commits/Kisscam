<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kiss Cam Boda</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Transmisión de video */
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Marco superpuesto */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      border: 6px solid rgba(255, 255, 255, 0.7);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 10px;
    }
    /* Banner superior sutil */
    .header {
      background: rgba(255, 255, 255, 0.85);
      padding: 6px 20px;
      border-radius: 30px;
      border: 2px solid #ff4d6d;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(4px);
    }
    .header h1 {
      color: #c9184a;
      font-size: 1.3rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 800;
    }
    /* Banner inferior sutil */
    .footer {
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(4px);
      margin-bottom: 5px;
    }
    .heart {
      color: #ff4d6d;
      font-size: 1.2rem;
      animation: pulse 0.9s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.3); }
    }
    /* Botones de control compactos (Solo íconos) */
    .controls {
      position: absolute;
      bottom: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .btn-icon {
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
      transition: background 0.2s, transform 0.1s;
    }
    .btn-icon:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.3);
    }

    /* Ajustes específicos para pantalla apaisada / horizontal */
    @media (orientation: landscape) {
      .overlay {
        padding: 12px 10px;
        border-width: 8px;
      }
      .header h1 {
        font-size: 1.1rem;
      }
      .footer {
        font-size: 0.85rem;
        padding: 4px 12px;
      }
      .controls {
        bottom: 10px;
        right: 10px;
      }
      .btn-icon {
        width: 36px;
        height: 36px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="container" id="app">
    <video id="camera" autoplay playsinline muted></video>

    <div class="overlay">
      <div class="header">
        <h1>💋 KISS CAM 💋</h1>
      </div>
      <div class="footer">
        <span>¡Beso, beso, beso!</span>
        <span class="heart">❤️</span>
      </div>
    </div>

    <!-- Botones compactos con íconos -->
    <div class="controls">
      <button class="btn-icon" id="switch-cam" title="Cambiar Cámara">🔄</button>
      <button class="btn-icon" id="fullscreen" title="Pantalla Completa">⛶</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('camera');
    const switchBtn = document.getElementById('switch-cam');
    const fullscreenBtn = document.getElementById('fullscreen');
    let currentStream = null;
    let facingMode = "environment";

    // Prevenir el apagado/bloqueo de pantalla (WakeLock API)
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log("WakeLock error:", err.message);
      }
    }

    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode },
          audio: false
        });
        currentStream = stream;
        video.srcObject = stream;
        requestWakeLock();
      } catch (err) {
        alert("Error al acceder a la cámara: " + err.message);
      }
    }

    switchBtn.addEventListener('click', () => {
      facingMode = facingMode === "user" ? "environment" : "user";
      startCamera();
    });

    fullscreenBtn.addEventListener('click', () => {
      const app = document.getElementById('app');
      if (!document.fullscreenElement) {
        app.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    });

    startCamera();
  </script>
</body>
</html>
